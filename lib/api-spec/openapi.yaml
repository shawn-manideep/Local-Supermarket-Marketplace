openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /admin/dashboard:
    get:
      operationId: getAdminManagementDashboard
      security: [{ customerBearer: [] }]
      responses:
        "200":
          description: Real platform account counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDashboardOutcome" }
        "401": { description: Authentication required }
        "403": { description: Admin role required }
  /admin/vendors:
    get:
      operationId: listAdminVendors
      security: [{ customerBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/ManagementPage" }
        - { $ref: "#/components/parameters/ManagementPageSize" }
        - { $ref: "#/components/parameters/ManagementSearch" }
        - { $ref: "#/components/parameters/ManagementStatus" }
      responses:
        "200":
          description: Paginated vendor/store directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminManagementPage" }
  /admin/vendors/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAdminVendor
      security: [{ customerBearer: [] }]
      responses:
        "200":
          description: Scoped management detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDetailOutcome" }
  /admin/vendors/{id}/status:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: changeAdminVendorStatus
      security: [{ customerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminVendorStatusInput" }
      responses:
        "200": { description: Existing legal store transition committed and audited }
        "409": { description: Illegal or stale transition }
  /admin/customers:
    get:
      operationId: listAdminCustomers
      security: [{ customerBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/ManagementPage" }
        - { $ref: "#/components/parameters/ManagementPageSize" }
        - { $ref: "#/components/parameters/ManagementSearch" }
        - { $ref: "#/components/parameters/ManagementStatus" }
      responses:
        "200":
          description: Paginated customer directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminManagementPage" }
  /admin/customers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAdminCustomer
      security: [{ customerBearer: [] }]
      responses:
        "200":
          description: Minimal customer management detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDetailOutcome" }
  /admin/customers/{id}/status:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: changeAdminCustomerStatus
      security: [{ customerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAccountStatusInput" }
      responses:
        "200": { description: Customer access status committed and audited }
  /admin/delivery-partners/{partnerId}:
    parameters:
      - { name: partnerId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAdminDeliveryPartner
      security: [{ customerBearer: [] }]
      responses:
        "200":
          description: Partner detail including active assignment warning count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDetailOutcome" }
  /vendor/orders/{orderId}/delivery:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getVendorOrderDelivery
      security: [{ customerBearer: [] }]
      responses:
        "200":
          description: Latest assignment for own-store order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryAssignmentOutcome" }
    post:
      operationId: assignVendorOrderDelivery
      security: [{ customerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryAssignRequest" }
      responses:
        "200":
          description: Created pending assignment; pending replacement preserves prior cancelled record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryAssignmentOutcome" }
  /vendor/delivery-partners:
    get:
      operationId: getEligibleDeliveryPartners
      security: [{ customerBearer: [] }]
      responses:
        "200":
          description: Active partner display names and opaque selection identifiers only
          content:
            application/json:
              schema:
                type: object
                required: [partners]
                properties:
                  partners:
                    type: array
                    items:
                      type: object
                      required: [id, displayName, status]
                      properties:
                        id: { type: string, format: uuid }
                        displayName: { type: string }
                        status: { type: string, enum: [ACTIVE] }
  /delivery-partner/deliveries/{assignmentId}:
    parameters:
      - { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getOwnDeliveryDetails
      security: [{ customerBearer: [] }]
      responses:
        "200":
          description: Own assignment and minimum fulfillment snapshot; rejected/cancelled addresses withheld
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryAssignmentOutcome" }
  /delivery-partner/deliveries/{assignmentId}/actions:
    parameters:
      - { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: performOwnDeliveryAction
      security: [{ customerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryDutyRequest" }
      responses:
        "200":
          description: State-checked transactional duty/order transition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryAssignmentOutcome" }
  /delivery-partner/login:
    post:
      operationId: signInDeliveryPartner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartnerCredentials" }
      responses:
        "200":
          description: Supabase tokens for an active authenticated partner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerSessionOutcome" }
        "401": { description: Invalid username or password }
        "403": { description: Verified account is inactive }
        "429": { description: Too many sign-in attempts }
  /delivery-partner/me:
    get:
      operationId: getDeliveryPartnerProfile
      security: [{ customerBearer: [] }]
      responses:
        "200":
          description: Current active partner's safe profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerProfileOutcome" }
        "401": { description: Authentication required }
        "403": { description: Partner role and active status required }
  /delivery-partner/dashboard:
    get:
      operationId: getDeliveryPartnerDashboard
      security: [{ customerBearer: [] }]
      responses:
        "200":
          description: Authenticated partner's counts for today in Asia/Kolkata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerDashboardOutcome" }
        "401": { description: Authentication required }
        "403": { description: Partner role and active status required }
  /delivery-partner/deliveries:
    get:
      operationId: getDeliveryPartnerDeliveries
      security: [{ customerBearer: [] }]
      responses:
        "200":
          description: Own assignment metadata only; no customer or order details, no actions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerDeliveriesOutcome" }
        "401": { description: Authentication required }
        "403": { description: Partner role and active status required }
  /admin/delivery-partners:
    get:
      operationId: listAdminDeliveryPartners
      security: [{ customerBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/ManagementPage" }
        - { $ref: "#/components/parameters/ManagementPageSize" }
        - { $ref: "#/components/parameters/ManagementSearch" }
        - { $ref: "#/components/parameters/ManagementStatus" }
      responses:
        "200":
          description: Paginated administrator partner directory, with legacy partners alias
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminManagementPage" }
        "401": { description: Authentication required }
        "403": { description: Admin role required }
    post:
      operationId: provisionAdminDeliveryPartner
      security: [{ customerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartnerProvisionInput" }
      responses:
        "201":
          description: Provisioned partner, never password or Auth email
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerAdministrationOutcome" }
        "400": { description: Invalid details }
        "401": { description: Authentication required }
        "403": { description: Admin role required }
        "409": { description: Username already in use }
  /admin/delivery-partners/{partnerId}/status:
    patch:
      operationId: updateAdminDeliveryPartnerStatus
      security: [{ customerBearer: [] }]
      parameters:
        - in: path
          name: partnerId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartnerStatusInput" }
      responses:
        "200":
          description: Updated partner status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerAdministrationOutcome" }
        "400": { description: Invalid status }
        "401": { description: Authentication required }
        "403": { description: Admin role required }
        "404": { description: Partner not found }
  /customer/orders:
    post:
      operationId: placeCustomerOrder
      summary: Atomically place one order per cart and deduct variant stock once
      security:
        - customerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerCheckoutSubmission" }
      responses:
        "201":
          description: Placed order or successful idempotent replay; no private inventory fields
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCheckoutOutcome" }
        "400":
          description: Invalid quantity or malformed request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockFailure" }
        "401": { description: Sign-in required }
        "403": { description: Customer role required }
        "404": { description: Owned delivery address not found }
        "409":
          description: Stock changed, cart is unavailable, or checkout identity conflicts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockFailure" }
  /customer/orders/{orderId}/repeat-preview:
    get:
      operationId: previewCustomerReorder
      summary: Evaluate exact historical items using current store availability and prices
      security:
        - customerBearer: []
      parameters:
        - $ref: "#/components/parameters/ReorderOrderId"
        - in: query
          name: addressId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: orderItemId
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Availability preview; no cart or order mutation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReorderPreview"
        "401": { description: Sign-in required }
        "403": { description: Customer role required }
        "404": { description: "Owned order, item or delivery address not found" }
  /customer/orders/{orderId}/repeat:
    post:
      operationId: submitCustomerReorder
      summary: Add eligible exact historical items to cart, never place an order
      security:
        - customerBearer: []
      parameters:
        - $ref: "#/components/parameters/ReorderOrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderSubmission"
      responses:
        "200":
          description: Committed added and unavailable items, with current cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReorderOutcome"
        "400": { description: Invalid request; client price and ownership fields rejected }
        "401": { description: Sign-in required }
        "403": { description: Customer role required }
        "404": { description: "Owned order, item or delivery address not found" }
        "409": { description: Explicit store switch confirmation or a new idempotency intent required }
  /customer/categories:
    get:
      operationId: getCustomerShoppingCategories
      summary: Category filters from stores eligible for a saved delivery pincode
      security:
        - customerBearer: []
      parameters:
        - in: query
          name: pincode
          required: true
          schema:
            type: string
            pattern: '^[1-9]\d{5}$'
      responses:
        "200":
          description: Public category filters; commercial and inventory fields are never included
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerShoppingCategories"
        "400":
          description: Invalid pincode
        "401":
          description: Sign-in required
        "403":
          description: Customer role required
        "404":
          description: No owned saved address for this pincode
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  parameters:
    ManagementPage:
      name: page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
    ManagementPageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ManagementSearch:
      name: search
      in: query
      schema: { type: string, maxLength: 120 }
    ManagementStatus:
      name: status
      in: query
      schema: { type: string, enum: [PENDING_APPROVAL, ACTIVE, SUSPENDED, REJECTED, INACTIVE] }
    ReorderOrderId:
      in: path
      name: orderId
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    customerBearer:
      type: http
      scheme: bearer
  schemas:
    AdminDashboardOutcome:
      type: object
      required: [dashboard]
      properties:
        dashboard:
          type: object
          required: [totalCustomers, activeCustomers, inactiveCustomers, totalVendors, pendingVendors, activeVendors, totalDeliveryPartners, activeDeliveryPartners, inactiveDeliveryPartners]
          properties:
            totalCustomers: { type: integer }
            activeCustomers: { type: integer }
            inactiveCustomers: { type: integer }
            totalVendors: { type: integer }
            pendingVendors: { type: integer }
            activeVendors: { type: integer }
            totalDeliveryPartners: { type: integer }
            activeDeliveryPartners: { type: integer }
            inactiveDeliveryPartners: { type: integer }
    AdminManagementRow:
      type: object
      required: [id, displayName, email, username, status, createdAt, storeId, storeName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: [string, "null"] }
        email: { type: [string, "null"] }
        username: { type: [string, "null"] }
        status: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        storeId: { type: [string, "null"], format: uuid }
        storeName: { type: [string, "null"] }
    AdminManagementPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminManagementRow" } }
        partners: { type: array, items: { $ref: "#/components/schemas/AdminManagementRow" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    AdminDetailOutcome:
      type: object
      required: [account]
      properties:
        account:
          allOf:
            - { $ref: "#/components/schemas/AdminManagementRow" }
            - type: object
              required: [contactNumber, orderCount, activeAssignments, allowedStatuses]
              properties:
                contactNumber: { type: [string, "null"] }
                orderCount: { type: [integer, "null"] }
                activeAssignments: { type: integer }
                allowedStatuses: { type: array, items: { type: string } }
    AdminVendorStatusInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [PENDING_APPROVAL, ACTIVE, SUSPENDED, REJECTED] }
    AdminAccountStatusInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    PartnerCredentials:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 30, pattern: "^[A-Za-z][A-Za-z0-9_]{2,29}$" }
        password: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
    PartnerSessionOutcome:
      type: object
      required: [session]
      properties:
        session:
          type: object
          required: [access_token, refresh_token]
          properties:
            access_token: { type: string }
            refresh_token: { type: string }
    PartnerProfile:
      type: object
      required: [username, displayName, contactNumber, status]
      properties:
        username: { type: string }
        displayName: { type: string }
        contactNumber: { type: [string, "null"] }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    PartnerProfileOutcome:
      type: object
      required: [partner]
      properties:
        partner: { $ref: "#/components/schemas/PartnerProfile" }
    PartnerAdminRecord:
      allOf:
        - { $ref: "#/components/schemas/PartnerProfile" }
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    PartnerDirectoryOutcome:
      type: object
      required: [partners]
      properties:
        partners: { type: array, items: { $ref: "#/components/schemas/PartnerAdminRecord" } }
    PartnerAdministrationOutcome:
      type: object
      required: [partner]
      properties:
        partner: { $ref: "#/components/schemas/PartnerAdminRecord" }
    PartnerProvisionInput:
      type: object
      additionalProperties: false
      required: [username, password, displayName, status]
      properties:
        username: { type: string, minLength: 3, maxLength: 30, pattern: "^[A-Za-z][A-Za-z0-9_]{2,29}$" }
        password: { type: string, minLength: 8, maxLength: 128, writeOnly: true }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        contactNumber: { type: [string, "null"], pattern: "^(?:\\+91)?[6-9]\\d{9}$" }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    PartnerStatusInput:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        confirmActiveAssignments: { type: boolean, default: false }
    PartnerDashboardOutcome:
      type: object
      required: [summary]
      properties:
        summary:
          type: object
          required: [total, pending, assigned, inProgress, completed, cancelled, rejected]
          properties:
            total: { type: integer, minimum: 0 }
            pending: { type: integer, minimum: 0 }
            assigned: { type: integer, minimum: 0 }
            inProgress: { type: integer, minimum: 0 }
            completed: { type: integer, minimum: 0 }
            cancelled: { type: integer, minimum: 0 }
            rejected: { type: integer, minimum: 0 }
            accepted: { type: integer, minimum: 0 }
            pickedUp: { type: integer, minimum: 0 }
            outForDelivery: { type: integer, minimum: 0 }
            delivered: { type: integer, minimum: 0 }
    DeliveryAssignment:
      type: object
      required: [id, orderId, orderReference, storeName, orderStatus, orderTotal, partnerName, status, assignedAt, acceptedAt, rejectedAt, pickedUpAt, deliveredAt, createdAt, updatedAt, deliveryAddress, recipientName]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        orderReference: { type: string }
        storeName: { type: string }
        orderStatus: { type: string }
        orderTotal: { type: string }
        partnerName: { type: string }
        status: { type: string, enum: [PENDING, ACCEPTED, REJECTED, PICKED_UP, OUT_FOR_DELIVERY, DELIVERED, CANCELLED] }
        assignedAt: { type: string, format: date-time }
        acceptedAt: { type: [string, "null"], format: date-time }
        rejectedAt: { type: [string, "null"], format: date-time }
        pickedUpAt: { type: [string, "null"], format: date-time }
        deliveredAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deliveryAddress: { type: [object, "null"], additionalProperties: true }
        recipientName: { type: [string, "null"] }
    DeliveryAssignRequest:
      type: object
      additionalProperties: false
      required: [partnerId]
      properties:
        partnerId: { type: string, format: uuid }
    DeliveryDutyRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [ACCEPT, REJECT, PICKUP, START, DELIVER] }
    DeliveryAssignmentOutcome:
      type: object
      required: [assignment]
      properties:
        assignment:
          anyOf:
            - { $ref: "#/components/schemas/DeliveryAssignment" }
            - { type: "null" }
    PartnerDeliveriesOutcome:
      type: object
      required: [deliveries]
      properties:
        deliveries:
          type: array
          items: { $ref: "#/components/schemas/DeliveryAssignment" }
    CustomerCheckoutSubmission:
      type: object
      additionalProperties: false
      required: [cartId, addressId, paymentMethod, idempotencyKey]
      properties:
        cartId: { type: string, format: uuid }
        addressId: { type: string, format: uuid }
        paymentMethod: { type: string, enum: [COD] }
        idempotencyKey: { type: string, format: uuid }
    CustomerCheckoutOutcome:
      type: object
      required: [order]
      properties:
        order:
          type: object
          description: Existing safe order detail with immutable items and status history
          required: [id, status, totalAmount, items, statusHistory]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [PLACED, ACCEPTED, PREPARING, READY, OUT_FOR_DELIVERY, DELIVERED, REJECTED, CANCELLED] }
            totalAmount: { type: string }
            items: { type: array, items: { type: object } }
            statusHistory: { type: array, items: { type: object } }
    StockFailure:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code:
          type: string
          enum: [OUT_OF_STOCK, INSUFFICIENT_STOCK, VARIANT_UNAVAILABLE, INVALID_QUANTITY, ORDER_ALREADY_PROCESSED, IDEMPOTENCY_CONFLICT]
    ReorderSubmission:
      type: object
      additionalProperties: false
      required: [addressId, idempotencyKey]
      properties:
        addressId: { type: string, format: uuid }
        idempotencyKey: { type: string, format: uuid }
        orderItemId: { type: string, format: uuid }
        confirmStoreSwitch: { type: boolean }
    ReorderItem:
      type: object
      additionalProperties: false
      required: [orderItemId, productName, variantNameSnapshot, quantity, currentUnitPrice, available, reason]
      properties:
        orderItemId: { type: string, format: uuid }
        productName: { type: string }
        variantNameSnapshot: { type: [string, "null"] }
        quantity: { type: integer, minimum: 1 }
        currentUnitPrice: { type: [string, "null"] }
        available: { type: boolean }
        reason: { type: [string, "null"] }
    ReorderPreview:
      type: object
      additionalProperties: false
      required: [storeAvailable, storeSwitchRequired, storeName, existingStoreName, items, canAddCount]
      properties:
        storeAvailable: { type: boolean }
        storeSwitchRequired: { type: boolean }
        storeName: { type: string }
        existingStoreName: { type: [string, "null"] }
        items:
          type: array
          items: { $ref: "#/components/schemas/ReorderItem" }
        canAddCount: { type: integer, minimum: 0 }
    ReorderOutcome:
      type: object
      additionalProperties: false
      required: [cart, added, unavailable, addedCount]
      properties:
        cart:
          description: Existing customer cart response, with server-owned current prices
          type: [object, "null"]
          additionalProperties: true
        added:
          type: array
          items: { $ref: "#/components/schemas/ReorderItem" }
        unavailable:
          type: array
          items: { $ref: "#/components/schemas/ReorderItem" }
