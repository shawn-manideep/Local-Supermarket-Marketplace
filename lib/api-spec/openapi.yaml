openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /vendor/documents:
    get:
      operationId: getVendorDocuments
      tags: [VendorDocuments]
      responses:
        '200':
          description: Own-store document metadata and onboarding status, never private storage references
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorDocumentStatus'
  /vendor/documents/{documentType}:
    put:
      operationId: uploadVendorDocument
      tags: [VendorDocuments]
      parameters:
        - name: documentType
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/VendorDocumentType'
        - name: fileName
          in: query
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/pdf:
            schema: {type: string, format: binary}
          image/jpeg:
            schema: {type: string, format: binary}
          image/png:
            schema: {type: string, format: binary}
      responses:
        '201':
          description: Upload or replacement committed after successful private upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorDocumentStatus'
  /vendor/documents/{documentId}/content:
    get:
      operationId: viewVendorDocument
      tags: [VendorDocuments]
      parameters:
        - name: documentId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Authorized own-store current document bytes, private no-store
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
  /vendor/product-matches:
    get:
      operationId: getVendorProductMatches
      tags: [VendorCatalog]
      parameters:
        - name: name
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 200}
        - name: brand
          in: query
          schema: {type: string, maxLength: 200}
        - name: categoryId
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Existing Master Catalog duplicate candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorProductMatchesResponse'
  /vendor/products:
    post:
      operationId: createVendorLocalProduct
      tags: [VendorCatalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorLocalProductCreate'
      responses:
        '201':
          description: Store-local product with selling variants; no Master Catalog write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorLocalProductResponse'
        '403':
          description: New Vendor mandatory documents incomplete
        '409':
          description: Exact duplicate or unconfirmed similar candidates
  /customer/login:
    post:
      operationId: loginCustomerUsername
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerCredentials'
      responses:
        '200':
          description: Existing Customer Supabase session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerSessionOutcome'
        '401':
          description: Invalid username or password
  /auth/recovery:
    post:
      operationId: requestAccountRecovery
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRecoveryInput'
      responses:
        '202':
          description: Generic confirmation, identical for known and unknown identities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRecoveryOutcome'
        '429':
          description: Too many recovery requests
  /admin/master-catalog/excel:
    get:
      operationId: downloadMasterCatalogExcel
      security: [{ customerBearer: [] }]
      responses:
        "200":
          description: Fresh canonical catalog workbook; never vendor commercial data
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { $ref: "#/components/schemas/CatalogWorkbook" }
        "403": { description: Admin only }
  /admin/master-catalog/excel/template:
    get:
      operationId: downloadMasterCatalogTemplate
      security: [{ customerBearer: [] }]
      responses:
        "200":
          description: Current-ID update template with workbook instructions
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { $ref: "#/components/schemas/CatalogWorkbook" }
  /admin/master-catalog/excel/preview:
    post:
      operationId: previewMasterCatalogExcel
      security: [{ customerBearer: [] }]
      parameters:
        - { name: filename, in: query, required: true, schema: { type: string, maxLength: 180 } }
      requestBody:
        required: true
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: { $ref: "#/components/schemas/CatalogWorkbook" }
      responses:
        "200":
          description: Validation and change preview; no database writes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogExcelPreview" }
        "413": { description: Workbook exceeds upload or expansion limits }
        "403": { description: Admin only }
  /admin/master-catalog/excel/apply:
    post:
      operationId: applyMasterCatalogExcel
      security: [{ customerBearer: [] }]
      parameters:
        - { name: filename, in: query, required: true, schema: { type: string, maxLength: 180 } }
        - { name: X-Catalog-Preview, in: header, required: true, schema: { type: string, maxLength: 4096 } }
        - { name: X-Catalog-Confirm, in: header, required: true, schema: { type: string, enum: ["true"] } }
      requestBody:
        required: true
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: { $ref: "#/components/schemas/CatalogWorkbook" }
      responses:
        "200":
          description: Atomic canonical-only update and audit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogExcelApplied" }
        "400": { description: Invalid workbook or confirmation; zero changes }
        "409": { description: Stale catalog or workbook; zero changes }
        "403": { description: Admin only }
  /admin/master-catalog/excel/history:
    get:
      operationId: getMasterCatalogExcelHistory
      security: [{ customerBearer: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
      responses:
        "200":
          description: Import history and live canonical counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogExcelHistory" }
  /admin/dashboard:
    get:
      operationId: getAdminManagementDashboard
      security: [{ customerBearer: [] }]
      responses:
        "200":
          description: Real platform account counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDashboardOutcome" }
        "401": { description: Authentication required }
        "403": { description: Admin role required }
  /admin/vendors:
    post:
      operationId: createAdminVendor
      security: [{ customerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VendorProvisionInput" }
      responses:
        "201":
          description: Vendor identity and complete store provisioned; PENDING_APPROVAL; zero product listings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDetailOutcome" }
        "400": { description: Invalid account or store profile }
        "403": { description: Admin role required }
        "409": { description: Username or authentication email already registered }
    get:
      operationId: listAdminVendors
      security: [{ customerBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/ManagementPage" }
        - { $ref: "#/components/parameters/ManagementPageSize" }
        - { $ref: "#/components/parameters/ManagementSearch" }
        - { $ref: "#/components/parameters/ManagementStatus" }
      responses:
        "200":
          description: Paginated vendor/store directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminManagementPage" }
  /admin/vendors/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateAdminVendorProfile
      security: [{ customerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VendorProfileInput" }
      responses:
        "200":
          description: Store-owned profile and specified daily hours updated; identity and commercial data unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDetailOutcome" }
        "400": { description: Invalid or disallowed fields }
        "403": { description: Admin role required }
        "404": { description: Vendor store not found }
    get:
      operationId: getAdminVendor
      security: [{ customerBearer: [] }]
      responses:
        "200":
          description: Scoped management detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDetailOutcome" }
  /admin/vendors/{id}/status:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: changeAdminVendorStatus
      security: [{ customerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminVendorStatusInput" }
      responses:
        "200": { description: Existing legal store transition committed and audited }
        "409": { description: Illegal or stale transition }
  /vendor/login:
    post:
      operationId: loginVendorUsername
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartnerCredentials" }
      responses:
        "200":
          description: Existing Supabase password session for registered vendor username
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerSessionOutcome" }
        "401": { description: Invalid username or password }
        "403": { description: Existing store suspension rule }
        "429": { description: Login rate limit exceeded }
  /vendor/store:
    get:
      operationId: getVendorStoreProfile
      security: [{ customerBearer: [] }]
      responses:
        "200":
          description: Existing vendor-owned store profile including physical location
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreProfileOutcome" }
    patch:
      operationId: updateVendorStoreProfile
      security: [{ customerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [{ $ref: "#/components/schemas/StoreProfileInput" }]
      responses:
        "200":
          description: Own store profile updated; no identity, commercial, delivery-area or order changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreProfileOutcome" }
  /admin/customers:
    get:
      operationId: listAdminCustomers
      security: [{ customerBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/ManagementPage" }
        - { $ref: "#/components/parameters/ManagementPageSize" }
        - { $ref: "#/components/parameters/ManagementSearch" }
        - { $ref: "#/components/parameters/ManagementStatus" }
      responses:
        "200":
          description: Paginated customer directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminManagementPage" }
  /admin/customers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAdminCustomer
      security: [{ customerBearer: [] }]
      responses:
        "200":
          description: Minimal customer management detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDetailOutcome" }
  /admin/customers/{id}/status:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: changeAdminCustomerStatus
      security: [{ customerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminAccountStatusInput" }
      responses:
        "200": { description: Customer access status committed and audited }
  /admin/delivery-partners/{partnerId}:
    parameters:
      - { name: partnerId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAdminDeliveryPartner
      security: [{ customerBearer: [] }]
      responses:
        "200":
          description: Partner detail including active assignment warning count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDetailOutcome" }
  /vendor/orders/{orderId}/delivery:
    parameters:
      - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getVendorOrderDelivery
      security: [{ customerBearer: [] }]
      responses:
        "200":
          description: Latest assignment for own-store order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryAssignmentOutcome" }
    post:
      operationId: assignVendorOrderDelivery
      security: [{ customerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryAssignRequest" }
      responses:
        "200":
          description: Created pending assignment; pending replacement preserves prior cancelled record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryAssignmentOutcome" }
  /vendor/delivery-partners:
    get:
      operationId: getEligibleDeliveryPartners
      security: [{ customerBearer: [] }]
      responses:
        "200":
          description: Active partner display names and opaque selection identifiers only
          content:
            application/json:
              schema:
                type: object
                required: [partners]
                properties:
                  partners:
                    type: array
                    items:
                      type: object
                      required: [id, displayName, status]
                      properties:
                        id: { type: string, format: uuid }
                        displayName: { type: string }
                        status: { type: string, enum: [ACTIVE] }
  /delivery-partner/deliveries/{assignmentId}:
    parameters:
      - { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getOwnDeliveryDetails
      security: [{ customerBearer: [] }]
      responses:
        "200":
          description: Own assignment and minimum fulfillment snapshot; rejected/cancelled addresses withheld
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryAssignmentOutcome" }
  /delivery-partner/deliveries/{assignmentId}/actions:
    parameters:
      - { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: performOwnDeliveryAction
      security: [{ customerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeliveryDutyRequest" }
      responses:
        "200":
          description: State-checked transactional duty/order transition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryAssignmentOutcome" }
  /delivery-partner/login:
    post:
      operationId: signInDeliveryPartner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartnerCredentials" }
      responses:
        "200":
          description: Supabase tokens for an active authenticated partner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerSessionOutcome" }
        "401": { description: Invalid username or password }
        "403": { description: Verified account is inactive }
        "429": { description: Too many sign-in attempts }
  /delivery-partner/me:
    get:
      operationId: getDeliveryPartnerProfile
      security: [{ customerBearer: [] }]
      responses:
        "200":
          description: Current active partner's safe profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerProfileOutcome" }
        "401": { description: Authentication required }
        "403": { description: Partner role and active status required }
  /delivery-partner/dashboard:
    get:
      operationId: getDeliveryPartnerDashboard
      security: [{ customerBearer: [] }]
      responses:
        "200":
          description: Authenticated partner's counts for today in Asia/Kolkata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerDashboardOutcome" }
        "401": { description: Authentication required }
        "403": { description: Partner role and active status required }
  /delivery-partner/deliveries:
    get:
      operationId: getDeliveryPartnerDeliveries
      security: [{ customerBearer: [] }]
      responses:
        "200":
          description: Own assignment metadata only; no customer or order details, no actions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerDeliveriesOutcome" }
        "401": { description: Authentication required }
        "403": { description: Partner role and active status required }
  /admin/delivery-partners:
    get:
      operationId: listAdminDeliveryPartners
      security: [{ customerBearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/ManagementPage" }
        - { $ref: "#/components/parameters/ManagementPageSize" }
        - { $ref: "#/components/parameters/ManagementSearch" }
        - { $ref: "#/components/parameters/ManagementStatus" }
      responses:
        "200":
          description: Paginated administrator partner directory, with legacy partners alias
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminManagementPage" }
        "401": { description: Authentication required }
        "403": { description: Admin role required }
    post:
      operationId: provisionAdminDeliveryPartner
      security: [{ customerBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartnerProvisionInput" }
      responses:
        "201":
          description: Provisioned partner, never password or Auth email
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerAdministrationOutcome" }
        "400": { description: Invalid details }
        "401": { description: Authentication required }
        "403": { description: Admin role required }
        "409": { description: Username already in use }
  /admin/delivery-partners/{partnerId}/status:
    patch:
      operationId: updateAdminDeliveryPartnerStatus
      security: [{ customerBearer: [] }]
      parameters:
        - in: path
          name: partnerId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartnerStatusInput" }
      responses:
        "200":
          description: Updated partner status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerAdministrationOutcome" }
        "400": { description: Invalid status }
        "401": { description: Authentication required }
        "403": { description: Admin role required }
        "404": { description: Partner not found }
  /customer/orders:
    post:
      operationId: placeCustomerOrder
      summary: Atomically place one order per cart and deduct variant stock once
      security:
        - customerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerCheckoutSubmission" }
      responses:
        "201":
          description: Placed order or successful idempotent replay; no private inventory fields
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCheckoutOutcome" }
        "400":
          description: Invalid quantity or malformed request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockFailure" }
        "401": { description: Sign-in required }
        "403": { description: Customer role required }
        "404": { description: Owned delivery address not found }
        "409":
          description: Stock changed, cart is unavailable, or checkout identity conflicts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockFailure" }
  /customer/orders/{orderId}/repeat-preview:
    get:
      operationId: previewCustomerReorder
      summary: Evaluate exact historical items using current store availability and prices
      security:
        - customerBearer: []
      parameters:
        - $ref: "#/components/parameters/ReorderOrderId"
        - in: query
          name: addressId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: orderItemId
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Availability preview; no cart or order mutation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReorderPreview"
        "401": { description: Sign-in required }
        "403": { description: Customer role required }
        "404": { description: "Owned order, item or delivery address not found" }
  /customer/orders/{orderId}/repeat:
    post:
      operationId: submitCustomerReorder
      summary: Add eligible exact historical items to cart, never place an order
      security:
        - customerBearer: []
      parameters:
        - $ref: "#/components/parameters/ReorderOrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderSubmission"
      responses:
        "200":
          description: Committed added and unavailable items, with current cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReorderOutcome"
        "400": { description: Invalid request; client price and ownership fields rejected }
        "401": { description: Sign-in required }
        "403": { description: Customer role required }
        "404": { description: "Owned order, item or delivery address not found" }
        "409": { description: Explicit store switch confirmation or a new idempotency intent required }
  /customer/categories:
    get:
      operationId: getCustomerShoppingCategories
      summary: Category filters from stores eligible for a saved delivery pincode
      security:
        - customerBearer: []
      parameters:
        - in: query
          name: pincode
          required: true
          schema:
            type: string
            pattern: '^[1-9]\d{5}$'
      responses:
        "200":
          description: Public category filters; commercial and inventory fields are never included
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerShoppingCategories"
        "400":
          description: Invalid pincode
        "401":
          description: Sign-in required
        "403":
          description: Customer role required
        "404":
          description: No owned saved address for this pincode
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  parameters:
    ManagementPage:
      name: page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
    ManagementPageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ManagementSearch:
      name: search
      in: query
      schema: { type: string, maxLength: 120 }
    ManagementStatus:
      name: status
      in: query
      schema: { type: string, enum: [PENDING_APPROVAL, ACTIVE, SUSPENDED, REJECTED, INACTIVE] }
    ReorderOrderId:
      in: path
      name: orderId
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    customerBearer:
      type: http
      scheme: bearer
  schemas:
    VendorDocumentType:
      type: string
      enum: [fssai, aadhaar, pan, photo, gst, trade_license, labour_license]
    VendorCurrentDocument:
      type: object
      required: [id, fileName, mimeType, sizeBytes, uploadedAt, version]
      properties:
        id: {type: string, format: uuid}
        fileName: {type: string}
        mimeType: {type: string, enum: [application/pdf, image/jpeg, image/png]}
        sizeBytes: {type: integer, minimum: 1, maximum: 5242880}
        uploadedAt: {type: string, format: date-time}
        version: {type: integer, minimum: 1}
    VendorDocumentSummary:
      type: object
      required: [type, label, mandatory, current]
      properties:
        type:
          $ref: '#/components/schemas/VendorDocumentType'
        label: {type: string}
        mandatory: {type: boolean}
        current:
          anyOf:
            - $ref: '#/components/schemas/VendorCurrentDocument'
            - type: 'null'
    VendorDocumentStatus:
      type: object
      required: [required, canManageCatalog, mandatoryCount, optionalCount, message, documents]
      properties:
        required: {type: boolean}
        canManageCatalog: {type: boolean}
        mandatoryCount: {type: integer, minimum: 0, maximum: 4}
        optionalCount: {type: integer, minimum: 0, maximum: 3}
        message: {type: string}
        documents:
          type: array
          items:
            $ref: '#/components/schemas/VendorDocumentSummary'
    VendorProductMatch:
      type: object
      required: [id, name, exactIdentity, canAddToStore]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        brand: {type: [string, 'null']}
        categoryName: {type: [string, 'null']}
        image: {type: [string, 'null']}
