openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /vendor/events:
    get:
      operationId: streamVendorPortalEvents
      security: [{customerBearer: []}]
      responses:
        '200':
          description: Authenticated foreground SSE refresh hints for this Vendor only
          content:
            text/event-stream:
              schema: {type: string}
  /delivery-partner/events:
    get:
      operationId: streamPartnerPortalEvents
      security: [{customerBearer: []}]
      responses:
        '200':
          description: Authenticated foreground SSE refresh hints for eligible active Partners
          content:
            text/event-stream:
              schema: {type: string}
  /vendor/documents/{documentId}/expiry:
    patch:
      operationId: updateVendorFssaiExpiry
      security: [{customerBearer: []}]
      parameters:
        - {in: path, name: documentId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FssaiExpiryInput'}
      responses:
        '200':
          description: Current document status; date changes require fresh document review
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VendorDocumentStatus'}
  /admin/vendors/{vendorId}/documents/{documentId}/expiry:
    patch:
      operationId: updateAdminFssaiExpiry
      security: [{customerBearer: []}]
      parameters:
        - {in: path, name: vendorId, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: documentId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FssaiExpiryInput'}
      responses:
        '200':
          description: Current document status; date changes require fresh document review
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VendorDocumentStatus'}
  /vendor/notifications:
    get:
      operationId: listVendorNotifications
      security: [{customerBearer: []}]
      responses:
        '200':
          description: Persistent in-app notifications; expiry milestones checked at request time
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VendorNotificationFeed'}
  /vendor/notifications/{notificationId}/read:
    post:
      operationId: acknowledgeVendorNotification
      security: [{customerBearer: []}]
      parameters:
        - {in: path, name: notificationId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Acknowledged by owning Vendor
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: {type: boolean}
  /admin/vendors/{vendorId}/notifications:
    get:
      operationId: listAdminVendorNotifications
      security: [{customerBearer: []}]
      parameters:
        - {in: path, name: vendorId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Vendor notification creation and acknowledgement history
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VendorNotificationFeed'}
  /api/vendor/bank-details:
    get:
      operationId: getVendorBankDetails
      security: [{customerBearer: []}]
      responses:
        '200':
          description: Own bank submission; account number always masked
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BankSubmissionResponse'}
        '403': {description: Vendor role required}
    patch:
      operationId: submitVendorBankDetails
      security: [{customerBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BankSubmissionInput'}
      responses:
        '200':
          description: Submission saved pending review; previous approval invalidated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BankSubmissionResponse'}
        '400': {description: Invalid fields or missing initial account number}
        '403': {description: Vendor role required}
  /api/admin/vendors/{vendorId}/bank-details:
    parameters:
      - {name: vendorId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getAdminVendorBankDetails
      security: [{customerBearer: []}]
      parameters:
        - {name: reveal, in: query, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: Admin-only bank review; full number only when explicitly revealed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BankSubmissionResponse'}
        '403': {description: Admin role required}
        '404': {description: Vendor not found}
  /api/admin/vendors/{vendorId}/bank-details/review:
    parameters:
      - {name: vendorId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: reviewVendorBankDetails
      security: [{customerBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [submissionId, action]
              properties:
                submissionId: {type: string, format: uuid}
                action: {type: string, enum: [APPROVE, REJECT]}
                reason: {type: string, minLength: 1, maxLength: 1000, description: Required when rejecting}
      responses:
        '200':
          description: Decision audited against the unchanged current submission
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BankSubmissionResponse'}
        '400': {description: Invalid decision or missing rejection reason}
        '403': {description: Admin role required}
        '409': {description: Stale or already reviewed submission}
  /api/vendor/orders/report.pdf:
    get:
      operationId: downloadVendorOrderReport
      security: [{customerBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/ReportOrderDateFilter'}
        - {$ref: '#/components/parameters/ReportStartDate'}
        - {$ref: '#/components/parameters/ReportEndDate'}
        - {name: status, in: query, schema: {type: string}}
      responses:
        '200':
          description: Private unpaginated PDF using owned order snapshots, Asia/Kolkata dates
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '400': {description: Invalid filters; store overrides are not accepted}
        '403': {description: Vendor role required}
  /api/admin/orders/report.pdf:
    get:
      operationId: downloadAdminOrderReport
      security: [{customerBearer: []}]
      parameters:
        - {$ref: '#/components/parameters/ReportOrderDateFilter'}
        - {$ref: '#/components/parameters/ReportStartDate'}
        - {$ref: '#/components/parameters/ReportEndDate'}
        - {name: storeId, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200':
          description: Admin-only all-store or selected-store PDF; pagination does not truncate exports
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '400': {description: Invalid filters}
        '403': {description: Admin role required}
  /api/delivery-partner/available-deliveries:
    get:
      operationId: getAvailableDeliveries
      security: [{customerBearer: []}]
      responses:
        '200':
          description: Eligible Ready offers for an active partner; no customer contact/address data
          content:
            application/json:
              schema:
                type: object
                required: [deliveries]
                properties:
                  deliveries:
                    type: array
                    items: {$ref: '#/components/schemas/AvailableDeliveryOffer'}
        '403': {description: Active Delivery Partner role required}
  /api/delivery-partner/orders/{orderId}/claim:
    parameters:
      - {name: orderId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: claimAvailableDelivery
      security: [{customerBearer: []}]
      requestBody:
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '200':
          description: Atomically accepted delivery, bound to the authenticated partner
          content:
            application/json:
              schema:
                type: object
                required: [assignment]
                properties:
                  assignment: {$ref: '#/components/schemas/DeliveryAssignment'}
        '403': {description: Active Delivery Partner role required}
        '409': {description: Another partner won or delivery is no longer eligible}
  /api/delivery-partner/deliveries/{assignmentId}/photo:
    parameters:
      - {name: assignmentId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: savePickupPhotograph
      security: [{customerBearer: []}]
      parameters:
        - {name: fileName, in: query, schema: {type: string, maxLength: 200}}
        - {name: capturedAt, in: query, schema: {type: string, format: date-time}}
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: {type: string, format: binary}
          image/png:
            schema: {type: string, format: binary}
      responses:
        '201':
          description: Validated image saved privately before pickup; maximum 5 MiB
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PickupPhotoResponse'}
        '403': {description: Active assigned Delivery Partner required}
        '404': {description: Assignment does not belong to the partner}
        '409': {description: Assignment already picked up or changed}
        '413': {description: Image too large}
    get:
      operationId: getOwnPickupPhotograph
      security: [{customerBearer: []}]
      responses:
        '200':
          description: Authenticated private image bytes; no public object URL
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
        '404': {description: Missing photo or assignment not owned}
  /api/delivery-partner/deliveries/{assignmentId}/photo/metadata:
    parameters:
      - {name: assignmentId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getOwnPickupPhotoMetadata
      security: [{customerBearer: []}]
      responses:
        '200':
          description: Own photo metadata; null until securely saved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PickupPhotoResponse'}
        '404': {description: Assignment not owned}
  /api/admin/deliveries/{assignmentId}/photo:
    parameters:
      - {name: assignmentId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getAdminPickupPhotograph
      security: [{customerBearer: []}]
      responses:
        '200':
          description: Admin-only authenticated private package image
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
        '403': {description: Admin role required}
        '404': {description: Missing photograph}
  /api/admin/deliveries/{assignmentId}/photo/metadata:
    parameters:
      - {name: assignmentId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getAdminPickupPhotoMetadata
      security: [{customerBearer: []}]
      responses:
        '200':
          description: Admin-only package-photo metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PickupPhotoResponse'}
        '403': {description: Admin role required}
  /api/admin/orders/{orderId}/delivery:
    parameters:
      - {name: orderId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getAdminOrderDeliveryHistory
      security: [{customerBearer: []}]
      responses:
        '200':
          description: All assignment attempts and recorded transition times for the order
          content:
            application/json:
              schema:
                type: object
                required: [assignments]
                properties:
                  assignments:
                    type: array
                    items:
                      type: object
                      required: [id, partnerUserId, partnerName, status, assignedAt]
                      properties:
                        id: {type: string, format: uuid}
                        partnerUserId: {type: string, format: uuid}
                        partnerName: {type: string}
                        status: {type: string}
                        assignedAt: {type: string, format: date-time}
                        acceptedAt: {type: [string, 'null'], format: date-time}
                        pickedUpAt: {type: [string, 'null'], format: date-time}
                        deliveredAt: {type: [string, 'null'], format: date-time}
        '403': {description: Admin role required}
  /api/delivery-partner/reports/daily.pdf:
    get:
      operationId: downloadOwnDailyDeliveryReport
      security: [{customerBearer: []}]
      parameters:
        - {name: date, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200':
          description: Own actual deliveries for the India-calendar day; order amounts, not earnings; no retry duplicates
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '400': {description: Invalid date or forbidden partner override}
        '403': {description: Active Delivery Partner required}
  /api/admin/reports/deliveries/daily.pdf:
    get:
      operationId: downloadAdminDailyDeliveryReport
      security: [{customerBearer: []}]
      parameters:
        - {name: date, in: query, required: true, schema: {type: string, format: date}}
        - {name: partnerId, in: query, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Selected partner or consolidated daily deliveries, Asia/Kolkata
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '403': {description: Admin role required}
  /api/branding:
    get:
      operationId: getApplicationBranding
      tags: [Branding]
      responses:
        '200':
          description: Shared public branding configuration; null uses the fallback logo
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationBranding'}
        '503': {description: Storage unavailable}
  /api/branding/logo:
    get:
      operationId: getApplicationLogo
      tags: [Branding]
      responses:
        '200':
          description: Active application logo, with no-store caching
          content:
            image/png:
              schema: {type: string, format: binary}
            image/jpeg:
              schema: {type: string, format: binary}
        '404': {description: No custom logo}
  /api/admin/branding/logo:
    post:
      operationId: saveApplicationLogo
      tags: [Branding]
      parameters:
        - name: fileName
          in: query
          required: true
          schema: {type: string, maxLength: 200}
      requestBody:
        required: true
        content:
          image/png:
            schema: {type: string, format: binary}
          image/jpeg:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: Admin-authorized atomic logo replacement
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationBranding'}
        '400': {description: "Invalid image content, filename or type"}
        '401': {description: Authentication required}
        '403': {description: Server-verified Admin role required}
        '413': {description: Logo exceeds 2 MiB}
        '503': {description: Storage unavailable; old logo retained}
  /api/customer/addresses:
    get:
      operationId: listManagedCustomerAddresses
      tags: [CustomerManagement]
      responses:
        '200':
          description: Caller-owned saved addresses, including legacy lines and structured details
          content:
            application/json:
              schema:
                type: object
                required: [addresses]
                properties:
                  addresses: {type: array, items: {$ref: '#/components/schemas/ManagedCustomerAddress'}}
        '401': {description: Authentication required}
        '403': {description: Customer role required}
    post:
      operationId: createManagedCustomerAddress
      tags: [CustomerManagement]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ManagedCustomerAddressInput'}
      responses:
        '201':
          description: Saved address
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedCustomerAddressResponse'}
        '400': {description: Invalid address fields}
        '401': {description: Authentication required}
        '403': {description: Customer role required}
  /api/customer/addresses/{addressId}:
    get:
      operationId: getManagedCustomerAddress
      tags: [CustomerManagement]
      parameters:
        - {name: addressId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Caller-owned address
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedCustomerAddressResponse'}
        '404': {description: Address not found or not owned}
    patch:
      operationId: updateManagedCustomerAddress
      tags: [CustomerManagement]
      parameters:
        - {name: addressId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ManagedCustomerAddressUpdate'}
      responses:
        '200':
          description: Saved address with existing fields preserved unless explicitly changed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedCustomerAddressResponse'}
        '400': {description: Invalid address fields}
        '404': {description: Address not found or not owned}
    delete:
      operationId: deleteManagedCustomerAddress
      tags: [CustomerManagement]
      parameters:
        - {name: addressId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Caller-owned address deleted}
        '404': {description: Address not found or not owned}
  /api/customer/stores/{storeId}/delivery-slots:
    get:
      operationId: getCustomerDeliverySlots
      tags: [CustomerMarketplace]
      parameters:
        - {name: storeId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: pincode, in: query, required: true, schema: {type: string, pattern: '^\d{6}$'}}
      responses:
        '200':
          description: Future one-hour store-hours slots for today and tomorrow in India time
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliverySlotsResponse'}
        '401': {description: Authentication required}
        '403': {description: Customer role required}
        '404': {description: Store not available for this pincode}
  /api/vendor/documents/submit:
    post:
      operationId: submitVendorDocuments
      tags: [VendorDocuments]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '200':
          description: Mandatory current versions submitted; catalog remains locked
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VendorDocumentStatus'}
        '401': {description: Authentication required}
        '403': {description: Vendor role required}
        '409': {description: 'Incomplete, already submitted, approved or exempt'}
  /api/admin/vendors/{vendorId}/documents/approve:
    post:
      operationId: approveVendorDocuments
      tags: [VendorDocuments]
      parameters:
        - {name: vendorId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DocumentApprovalRequest'}
      responses:
        '200':
          description: Current mandatory submission approved by Admin
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VendorDocumentStatus'}
        '401': {description: Authentication required}
        '403': {description: Admin role required}
        '409': {description: Stale submission or invalid review state}
  /api/admin/vendors/{vendorId}/documents/reject:
    post:
      operationId: rejectVendorDocuments
      tags: [VendorDocuments]
      parameters:
        - {name: vendorId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DocumentRejectionRequest'}
      responses:
        '200':
          description: Selected mandatory documents rejected with a required reason
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VendorDocumentStatus'}
        '400': {description: Invalid reason or document selection}
        '401': {description: Authentication required}
        '403': {description: Admin role required}
        '409': {description: Stale submission or invalid review state}
  /customer/saved-items:
    get:
      operationId: getCustomerSavedItems
      parameters:
        - in: query
          name: pincode
          schema: { type: string, pattern: '^[1-9][0-9]{5}$' }
      responses:
        '200':
          description: Own favorites with current listing availability
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomerSavedItem'
    post:
      operationId: saveCustomerItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, pincode]
              additionalProperties: false
              properties:
                productId: { type: string, format: uuid }
                pincode: { type: string, pattern: '^[1-9][0-9]{5}$' }
      responses:
        '201':
          description: Saved; repeats return 200 without duplication
          content:
            application/json:
              schema:
                type: object
                required: [saved, productId]
                properties:
                  saved: { type: boolean }
                  productId: { type: string, format: uuid }
  /customer/saved-items/{productId}:
    delete:
      operationId: removeCustomerSavedItem
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 'Own favorite removed, idempotently' }
  /customer/account-settings:
    get:
      operationId: getCustomerAccountSettings
      responses:
        '200':
          description: Safe account information
          content:
            application/json:
              schema:
                type: object
                required: [account]
                properties:
                  account:
                    type: object
                    required: [username, registeredEmail, fullName, phone]
                    properties:
                      username: { type: [string, 'null'] }
                      registeredEmail: { type: [string, 'null'] }
                      fullName: { type: [string, 'null'] }
                      phone: { type: [string, 'null'] }
  /customer/account-settings/password:
    post:
      operationId: changeCustomerPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword, confirmPassword]
              additionalProperties: false
              properties:
                currentPassword: { type: string, minLength: 1, maxLength: 128, format: password }
                newPassword: { type: string, minLength: 8, maxLength: 128, format: password }
                confirmPassword: { type: string, minLength: 8, maxLength: 128, format: password }
      responses:
        '200':
          description: Supabase password updated after current-password verification
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
  /vendor/product-images:
    post:
      operationId: uploadVendorProductImage
      parameters:
        - in: query
          name: fileName
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - in: query
          name: productId
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Store-owned managed image reference, not a bucket path
          content:
            application/json:
              schema:
                type: object
                required: [imageUrl]
                properties:
                  imageUrl: { type: string }
  /product-images/{storeId}/{imageId}:
    get:
      operationId: getPublishedProductImage
      parameters:
        - in: path
          name: storeId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: imageId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Linked active product image, or authenticated owning Vendor preview
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
  /vendor/documents:
    get:
      operationId: getVendorDocuments
      tags: [VendorDocuments]
      responses:
        '200':
          description: Own-store document metadata and onboarding status, never private storage references
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorDocumentStatus'
  /vendor/documents/{documentType}:
    put:
      operationId: uploadVendorDocument
      tags: [VendorDocuments]
      parameters:
        - name: documentType
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/VendorDocumentType'
        - name: fileName
          in: query
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/pdf:
            schema: {type: string, format: binary}
          image/jpeg:
            schema: {type: string, format: binary}
          image/png:
            schema: {type: string, format: binary}
      responses:
        '201':
          description: Upload or replacement committed after successful private upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorDocumentStatus'
  /vendor/documents/{documentId}/content:
    get:
      operationId: viewVendorDocument
