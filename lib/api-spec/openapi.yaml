          required: true
          schema:
            type: string
            pattern: '^[1-9]\d{5}$'
      responses:
        "200":
          description: Public category filters; commercial and inventory fields are never included
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerShoppingCategories"
        "400":
          description: Invalid pincode
        "401":
          description: Sign-in required
        "403":
          description: Customer role required
        "404":
          description: No owned saved address for this pincode
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  parameters:
    ReportOrderDateFilter:
      name: dateFilter
      in: query
      description: RECENT is the latest 50 orders; rolling day ranges include today; CUSTOM uses inclusive India-calendar dates; ALL is unbounded
      schema: {type: string, enum: [RECENT, WEEK, FIFTEEN_DAYS, MONTH, CUSTOM, ALL], default: ALL}
    ReportStartDate:
      name: startDate
      in: query
      description: Required for CUSTOM
      schema: {type: string, format: date}
    ReportEndDate:
      name: endDate
      in: query
      description: Required for CUSTOM; includes the whole end day in Asia/Kolkata
      schema: {type: string, format: date}
    ManagementPage:
      name: page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
    ManagementPageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ManagementSearch:
      name: search
      in: query
      schema: { type: string, maxLength: 120 }
    ManagementStatus:
      name: status
      in: query
      schema: { type: string, enum: [PENDING_APPROVAL, ACTIVE, SUSPENDED, REJECTED, INACTIVE] }
    ReorderOrderId:
      in: path
      name: orderId
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    customerBearer:
      type: http
      scheme: bearer
  schemas:
    BankSubmissionInput:
      type: object
      additionalProperties: false
      required: [accountHolderName, ifsc, bankName, bankBranch, vendorMobileNumber]
      properties:
        accountHolderName: {type: string, minLength: 2, maxLength: 120}
        accountNumber: {type: string, pattern: '^[0-9]{6,34}$', description: Required initially; omit to retain an unchanged saved number}
        ifsc: {type: string, pattern: '^[A-Za-z]{4}0[A-Za-z0-9]{6}$'}
        bankName: {type: string, minLength: 2, maxLength: 120}
        bankBranch: {type: string, minLength: 2, maxLength: 120}
        vendorMobileNumber: {type: string, pattern: '^(\+91)?[6-9][0-9]{9}$'}
    BankSubmissionResponse:
      type: object
      required: [bankDetails, history]
      properties:
        bankDetails:
          type: [object, 'null']
          properties:
            accountHolderName: {type: string}
            maskedAccountNumber: {type: string}
            accountNumber: {type: string, description: Only included in an explicit authorized Admin reveal}
            ifsc: {type: string}
            bankName: {type: string}
            bankBranch: {type: string}
            vendorMobileNumber: {type: string}
            status: {type: string, enum: [SUBMITTED, APPROVED, REJECTED]}
            submissionId: {type: string, format: uuid}
            rejectionReason: {type: [string, 'null']}
            submittedAt: {type: string, format: date-time}
            reviewedAt: {type: [string, 'null'], format: date-time}
        history:
          type: array
          items:
            type: object
            properties:
              action: {type: string}
              createdAt: {type: string, format: date-time}
              previousStatus: {type: [string, 'null']}
              nextStatus: {type: string}
              details: {type: object, additionalProperties: true}
    PickupPhotoResponse:
      type: object
      required: [photo]
      properties:
        photo:
          type: [object, 'null']
          properties:
            id: {type: string, format: uuid}
            capturedAt: {type: string, format: date-time}
            uploadedAt: {type: string, format: date-time}
            mimeType: {type: string, enum: [image/jpeg, image/png]}
    AvailableDeliveryOffer:
      type: object
      required: [orderId, orderReference, storeId, storeName, orderTotal, deliveryMode]
      properties:
        orderId: {type: string, format: uuid}
        orderReference: {type: string}
        storeId: {type: string, format: uuid}
        storeName: {type: string}
        orderTotal: {type: string}
        deliveryMode: {type: string, enum: [INSTANT, SCHEDULED]}
        scheduledStartAt: {type: [string, 'null'], format: date-time}
        scheduledEndAt: {type: [string, 'null'], format: date-time}
    CustomerSavedItem:
      type: object
      required: [productId, storeId, storeName, savedAt, available, unavailableReason, product]
      properties:
        productId: { type: string, format: uuid }
        storeId: { type: string, format: uuid }
        storeName: { type: string }
        savedAt: { type: string }
        available: { type: boolean }
        unavailableReason: { type: [string, 'null'] }
        product:
          $ref: '#/components/schemas/SavedListingProduct'
    SavedListingProduct:
      type: object
      required: [id, storeId, categoryId, name, description, price, availability, imageUrl, brand, categoryName, purchasable, variants]
      properties:
        id: { type: string, format: uuid }
        storeId: { type: string, format: uuid }
        storeName: { type: string }
        categoryId: { type: [string, 'null'] }
        name: { type: string }
        description: { type: [string, 'null'] }
        price: { type: string }
        availability: { type: boolean }
        imageUrl: { type: [string, 'null'] }
        brand: { type: [string, 'null'] }
        categoryName: { type: [string, 'null'] }
        purchasable: { type: boolean }
        variants:
          type: array
          items:
            type: object
            required: [id, productId, name, quantityValue, quantityUnit, price, availability, isActive, sortOrder, purchasable]
            properties:
              id: { type: string }
              productId: { type: string }
              name: { type: string }
              quantityValue: { type: string }
              quantityUnit: { type: string, enum: [g, kg, ml, l, piece, pack, dozen, bottle, box] }
              price: { type: string }
              availability: { type: boolean }
              isActive: { type: boolean }
              sortOrder: { type: integer }
              purchasable: { type: boolean }
    VendorDocumentType:
      type: string
      enum: [fssai, aadhaar, pan, photo, gst, trade_license, labour_license]
    ManagedCustomerAddressInput:
      type: object
      additionalProperties: false
      required: [recipientName, phone, city, state, pincode]
      anyOf:
        - {required: [houseNumber]}
        - {required: [line1]}
      properties:
        label: {type: [string, 'null'], minLength: 1, maxLength: 60}
        recipientName: {type: string, minLength: 1, maxLength: 120}
        phone: {type: string, pattern: '^[6-9]\d{9}$'}
        houseNumber: {type: string, minLength: 1, maxLength: 240}
        buildingName: {type: [string, 'null'], minLength: 1, maxLength: 160}
        landmark: {type: [string, 'null'], minLength: 1, maxLength: 240}
        locality: {type: [string, 'null'], minLength: 1, maxLength: 240}
        line1: {type: string, minLength: 1, maxLength: 240, description: Legacy input remains supported}
        line2: {type: [string, 'null'], minLength: 1, maxLength: 240}
        city: {type: string, minLength: 1, maxLength: 120}
        state: {type: string, minLength: 1, maxLength: 120}
        pincode: {type: string, pattern: '^[1-9]\d{5}$'}
        isDefault: {type: boolean}
    ManagedCustomerAddressUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        label: {type: [string, 'null'], minLength: 1, maxLength: 60}
        recipientName: {type: string, minLength: 1, maxLength: 120}
        phone: {type: string, pattern: '^[6-9]\d{9}$'}
        houseNumber: {type: string, minLength: 1, maxLength: 240}
        buildingName: {type: [string, 'null'], minLength: 1, maxLength: 160}
        landmark: {type: [string, 'null'], minLength: 1, maxLength: 240}
        locality: {type: [string, 'null'], minLength: 1, maxLength: 240}
        line1: {type: string, minLength: 1, maxLength: 240}
        line2: {type: [string, 'null'], minLength: 1, maxLength: 240}
        city: {type: string, minLength: 1, maxLength: 120}
        state: {type: string, minLength: 1, maxLength: 120}
        pincode: {type: string, pattern: '^[1-9]\d{5}$'}
        isDefault: {type: boolean}
    ManagedCustomerAddress:
      type: object
      required: [id, customerId, recipientName, phone, line1, line2, city, state, pincode, isDefault, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        customerId: {type: string, format: uuid}
        label: {type: [string, 'null']}
        recipientName: {type: string}
        phone: {type: string}
        houseNumber: {type: [string, 'null']}
        buildingName: {type: [string, 'null']}
        landmark: {type: [string, 'null']}
        locality: {type: [string, 'null']}
        line1: {type: string}
        line2: {type: [string, 'null']}
        city: {type: string}
        state: {type: string}
        pincode: {type: string}
        isDefault: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ManagedCustomerAddressResponse:
      type: object
      required: [address]
      properties:
        address: {$ref: '#/components/schemas/ManagedCustomerAddress'}
    DeliverySlotsResponse:
      type: object
      required: [timeZone, operatingStatus, slots]
      properties:
        timeZone: {type: string, enum: [Asia/Kolkata]}
        nextOpeningAt: {type: [string, 'null'], format: date-time}
        scheduledDeliveryAvailable: {type: boolean}
        operatingStatus: {type: string, enum: [OPEN, CLOSED]}
        slots:
          type: array
          items:
            type: object
            required: [startAt, endAt]
            properties:
              startAt: {type: string, format: date-time}
              endAt: {type: string, format: date-time}
    DocumentApprovalRequest:
      type: object
      additionalProperties: false
      required: [submissionId]
      properties:
        submissionId: {type: string, format: uuid}
    DocumentRejectionRequest:
      type: object
      additionalProperties: false
      required: [submissionId, reason, rejectedTypes]
      properties:
        submissionId: {type: string, format: uuid}
        reason: {type: string, minLength: 1, maxLength: 1000}
        rejectedTypes:
          type: array
          minItems: 1
          maxItems: 4
          items: {type: string, enum: [fssai, aadhaar, pan, photo]}
    DocumentVerificationState:
      type: string
      enum: [EXEMPT, DRAFT, SUBMITTED, APPROVED, REJECTED]
    VendorCurrentDocument:
      type: object
      required: [id, fileName, mimeType, sizeBytes, uploadedAt, version]
      properties:
        id: {type: string, format: uuid}
        fileName: {type: string}
        mimeType: {type: string, enum: [application/pdf, image/jpeg, image/png]}
        sizeBytes: {type: integer, minimum: 1, maximum: 5242880}
        uploadedAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        version: {type: integer, minimum: 1}
        verificationStatus: {type: string, enum: [DRAFT, SUBMITTED, APPROVED, REJECTED]}
        rejectionReason: {type: [string, 'null']}
        expiryDate: {type: [string, 'null'], format: date}
    VendorDocumentSummary:
      type: object
      required: [type, label, mandatory, current]
      properties:
        type:
          $ref: '#/components/schemas/VendorDocumentType'
        label: {type: string}
        mandatory: {type: boolean}
        current:
          anyOf:
            - $ref: '#/components/schemas/VendorCurrentDocument'
            - type: 'null'
    VendorDocumentStatus:
      type: object
      required: [required, canManageCatalog, mandatoryCount, optionalCount, message, documents]
      properties:
        required: {type: boolean}
        canManageCatalog: {type: boolean}
        verificationStatus: {$ref: '#/components/schemas/DocumentVerificationState'}
        submissionId: {type: [string, 'null'], format: uuid}
        submittedAt: {type: [string, 'null'], format: date-time}
        reviewedAt: {type: [string, 'null'], format: date-time}
        rejectionReason: {type: [string, 'null']}
        mandatoryCount: {type: integer, minimum: 0, maximum: 4}
        optionalCount: {type: integer, minimum: 0, maximum: 3}
        message: {type: string}
        fssai: {$ref: '#/components/schemas/FssaiStatus'}
        documents:
          type: array
          items:
            $ref: '#/components/schemas/VendorDocumentSummary'
    FssaiExpiryInput:
      type: object
      additionalProperties: false
      required: [expiryDate]
      properties:
        expiryDate: {type: string, format: date}
    FssaiStatus:
      type: object
      required: [expiryDate, status, daysRemaining]
      properties:
        expiryDate: {type: [string, 'null'], format: date}
        status: {type: string, enum: [DATE_REQUIRED, VALID, EXPIRING_SOON, EXPIRED]}
        daysRemaining: {type: [integer, 'null']}
    VendorNotification:
      type: object
      required: [id, kind, message, orderId, documentId, expiryDate, milestone, createdAt, readAt]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [NEW_ORDER, FSSAI_EXPIRY]}
        message: {type: string}
        orderId: {type: [string, 'null'], format: uuid}
        documentId: {type: [string, 'null'], format: uuid}
        expiryDate: {type: [string, 'null'], format: date}
        milestone: {type: [string, 'null'], enum: ['30', '7', '0', EXPIRED, null]}
        createdAt: {type: string, format: date-time}
        readAt: {type: [string, 'null'], format: date-time}
    VendorNotificationFeed:
      type: object
      required: [notifications, deliveryMode]
      properties:
        deliveryMode: {type: string, enum: [IN_APP_REALTIME_WITH_POLLING]}
        notifications:
          type: array
          items: {$ref: '#/components/schemas/VendorNotification'}
    VendorProductMatch:
      type: object
      required: [id, name, exactIdentity, canAddToStore]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        brand: {type: [string, 'null']}
        categoryName: {type: [string, 'null']}
        image: {type: [string, 'null']}
        exactIdentity: {type: boolean}
        canAddToStore: {type: boolean}
    VendorProductMatchesResponse:
      type: object
      required: [matches]
      properties:
        matches:
          type: array
          items:
            $ref: '#/components/schemas/VendorProductMatch'
    VendorLocalVariantInput:
      type: object
      required: [quantityValue, quantityUnit, price]
      properties:
        quantityValue: {type: number, exclusiveMinimum: 0}
        quantityUnit: {type: string, enum: [g, kg, ml, l, piece, pack, dozen, bottle, box]}
        price: {type: number, minimum: 0}
        stockQuantity: {type: integer, minimum: 0}
        availability: {type: boolean}
        isActive: {type: boolean}
        sku: {type: [string, 'null']}
        externalCode: {type: [string, 'null']}
    VendorLocalProductCreate:
      type: object
      required: [name, price, variants]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        brand: {type: [string, 'null'], maxLength: 200}
        description: {type: [string, 'null']}
        imageUrl:
          type: [string, 'null']
          maxLength: 2048
          description: 'HTTP(S) URL or a store-owned /api/product-images/{storeId}/{imageId} reference. Validated by the Vendor product image schema.'
        categoryId: {type: [string, 'null'], format: uuid}
        requestedCategoryName: {type: string, minLength: 1, maxLength: 120}
        sku: {type: [string, 'null']}
        externalCode: {type: [string, 'null']}
        price: {type: number, minimum: 0}
        stockQuantity: {type: integer, minimum: 0}
        availability: {type: boolean}
        isActive: {type: boolean}
        confirmSimilar: {type: boolean}
        variants:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/VendorLocalVariantInput'
    VendorLocalProductResponse:
      type: object
      required: [product]
      properties:
        product:
          type: object
          required: [id, storeId, name, price, stockQuantity, availability, isActive, variants]
          properties:
            id: {type: string, format: uuid}
            storeId: {type: string, format: uuid}
            masterProductId: {type: 'null'}
            name: {type: string}
            brand: {type: [string, 'null']}
            price: {type: string}
            stockQuantity: {type: integer}
            availability: {type: boolean}
            isActive: {type: boolean}
            variants:
              type: array
              items: {type: object, additionalProperties: true}
    AccountRecoveryInput:
      type: object
      additionalProperties: false
      required: [role, identity]
      properties:
        role:
          type: string
          enum: [customer, vendor, delivery_partner, admin]
        identity:
          type: string
          minLength: 1
          maxLength: 254
        identityType:
          type: string
          enum: [mobile, legacy]
          description: Defaults to legacy. Mobile requires a unique Auth-confirmed phone and is not available for Admin.
        client:
          type: string
          enum: [customer_native]
          description: Customer-only native recovery. Uses the fixed app callback, never a caller-supplied redirect.
    AccountRecoveryOutcome:
      type: object
      required: [message]
      properties:
        message:
          type: string
    CatalogWorkbook:
      type: string
      format: binary
    CatalogExcelSummary:
      type: object
      required: [added, updated, archived, unchanged]
      properties:
        added: { type: integer }
        updated: { type: integer }
        archived: { type: integer }
        unchanged: { type: integer }
    CatalogExcelError:
      type: object
      required: [sheet, row, column, message]
      properties:
        sheet: { type: string }
        row: { type: integer }
        column: { type: string }
        message: { type: string }
    CatalogExcelField:
      type: object
      required: [field, before, after]
      properties:
        field: { type: string }
        before: { type: ["string", "null"] }
        after: { type: ["string", "null"] }
    CatalogExcelChange:
      type: object
      required: [sheet, row, id, name, fields]
      properties:
        sheet: { type: string }
        row: { type: integer }
        id: { type: string }
        name: { type: string }
        fields: { type: array, items: { $ref: "#/components/schemas/CatalogExcelField" } }
    CatalogExcelPreview:
      type: object
      required: [valid, errors, warnings, summary, changes]
      properties:
        valid: { type: boolean }
        errors: { type: array, items: { $ref: "#/components/schemas/CatalogExcelError" } }
        warnings: { type: array, items: { type: string } }
        summary: { $ref: "#/components/schemas/CatalogExcelSummary" }
        changes: { type: array, items: { $ref: "#/components/schemas/CatalogExcelChange" } }
        previewToken: { type: string }
        expiresAt: { type: string, format: date-time }
    CatalogExcelApplied:
      type: object
      required: [applied, summary, version]
      properties:
        applied: { type: boolean }
        summary: { $ref: "#/components/schemas/CatalogExcelSummary" }
        version: { type: integer }
    CatalogExcelHistoryRow:
      type: object
      required: [version, createdAt, actorUserId, actorLabel, filename, added, updated, archived, unchanged, result]
      properties:
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        actorUserId: { type: string, format: uuid }
        actorLabel: { type: string }
        filename: { type: string }
        added: { type: integer }
        updated: { type: integer }
        archived: { type: integer }
        unchanged: { type: integer }
        result: { type: string, enum: [APPLIED] }
    CatalogExcelHistory:
      type: object
      required: [history, pagination, catalog]
      properties:
        history: { type: array, items: { $ref: "#/components/schemas/CatalogExcelHistoryRow" } }
        pagination:
          type: object
          required: [page, pageSize, total]
          properties:
            page: { type: integer }
            pageSize: { type: integer }
            total: { type: integer }
        catalog:
          type: object
          required: [products, categories, lastUpdated, updatedBy]
          properties:
            products: { type: integer }
            categories: { type: integer }
            lastUpdated: { type: ["string", "null"] }
            updatedBy: { type: ["string", "null"] }
    AdminDashboardOutcome:
      type: object
      required: [dashboard]
      properties:
        dashboard:
          type: object
          required: [totalCustomers, activeCustomers, inactiveCustomers, totalVendors, pendingVendors, activeVendors, totalDeliveryPartners, activeDeliveryPartners, inactiveDeliveryPartners]
          properties:
            totalCustomers: { type: integer }
            activeCustomers: { type: integer }
            inactiveCustomers: { type: integer }
            totalVendors: { type: integer }
            pendingVendors: { type: integer }
            activeVendors: { type: integer }
            totalDeliveryPartners: { type: integer }
            activeDeliveryPartners: { type: integer }
            inactiveDeliveryPartners: { type: integer }
    AdminManagementRow:
      type: object
      required: [id, displayName, email, username, status, createdAt, storeId, storeName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: [string, "null"] }
        email: { type: [string, "null"] }
        username: { type: [string, "null"] }
        status: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        storeId: { type: [string, "null"], format: uuid }
        documentVerificationStatus: {type: [string, 'null'], enum: [EXEMPT, DRAFT, SUBMITTED, APPROVED, REJECTED, null]}
        storeName: { type: [string, "null"] }
        ownerName: { type: [string, "null"] }
        city: { type: [string, "null"] }
        locality: { type: [string, "null"] }
        pincode: { type: [string, "null"] }
    AdminManagementPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminManagementRow" } }
        partners: { type: array, items: { $ref: "#/components/schemas/AdminManagementRow" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    AdminDetailOutcome:
      type: object
      required: [account]
      properties:
        account:
          allOf:
            - { $ref: "#/components/schemas/AdminManagementRow" }
            - type: object
              required: [contactNumber, orderCount, activeAssignments, allowedStatuses]
              properties:
                contactNumber: { type: [string, "null"] }
                orderCount: { type: [integer, "null"] }
                activeAssignments: { type: integer }
                allowedStatuses: { type: array, items: { type: string } }
                store:
                  oneOf:
                    - { $ref: "#/components/schemas/StoreProfile" }
                    - { type: "null" }
                hours: { type: array, items: { $ref: "#/components/schemas/StoreProfileHour" } }
    StoreProfileHour:
      type: object
      additionalProperties: false
      required: [dayOfWeek, isClosed]
      properties:
        dayOfWeek: { type: integer, minimum: 0, maximum: 6 }
        isClosed: { type: boolean }
        opensAt: { type: [string, "null"], description: HH:MM input; nullable for a closed day }
        closesAt: { type: [string, "null"], description: HH:MM input; closing must follow opening }
    StoreProfileInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        ownerName: { type: string, minLength: 1, maxLength: 100 }
        phone: { type: [string, "null"], description: Existing Indian phone validation }
        email: { type: [string, "null"], format: email, maxLength: 254, description: Contact email; editing does not change the Auth email }
        description: { type: [string, "null"], maxLength: 2000 }
        logoImageUrl: { type: [string, "null"], format: uri, maxLength: 2048 }
        addressLine1: { type: string, minLength: 1, maxLength: 250 }
        addressLine2: { type: [string, "null"], maxLength: 250 }
        locality: { type: string, minLength: 1, maxLength: 120 }
        city: { type: string, minLength: 1, maxLength: 120 }
        state: { type: string, minLength: 1, maxLength: 120 }
        pincode: { type: string, pattern: '^[1-9][0-9]{5}$' }
        handlingFee: { $ref: "#/components/schemas/HandlingFeeInput" }
        deliveryFee: { type: number, minimum: 0, maximum: 1000000 }
        minimumOrderValue: { type: number, minimum: 0, maximum: 1000000 }
    HandlingFeeInput:
      oneOf:
        - { type: number, minimum: 0, maximum: 1000000, multipleOf: 0.01 }
        - { type: string, pattern: '^\d+(?:\.\d{1,2})?$', description: "Non-negative rupee amount with up to two decimal places; maximum 1000000." }
    VendorProfileInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        ownerName: { type: string, minLength: 1, maxLength: 100 }
        phone: { type: [string, "null"] }
        email: { type: [string, "null"], format: email, maxLength: 254 }
        description: { type: [string, "null"], maxLength: 2000 }
        logoImageUrl: { type: [string, "null"], format: uri, maxLength: 2048 }
        addressLine1: { type: string, minLength: 1, maxLength: 250 }
        addressLine2: { type: [string, "null"], maxLength: 250 }
        locality: { type: string, minLength: 1, maxLength: 120 }
        city: { type: string, minLength: 1, maxLength: 120 }
