openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /customer/orders:
    post:
      operationId: placeCustomerOrder
      summary: Atomically place one order per cart and deduct variant stock once
      security:
        - customerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerCheckoutSubmission" }
      responses:
        "201":
          description: Placed order or successful idempotent replay; no private inventory fields
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerCheckoutOutcome" }
        "400":
          description: Invalid quantity or malformed request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockFailure" }
        "401": { description: Sign-in required }
        "403": { description: Customer role required }
        "404": { description: Owned delivery address not found }
        "409":
          description: Stock changed, cart is unavailable, or checkout identity conflicts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockFailure" }
  /customer/orders/{orderId}/repeat-preview:
    get:
      operationId: previewCustomerReorder
      summary: Evaluate exact historical items using current store availability and prices
      security:
        - customerBearer: []
      parameters:
        - $ref: "#/components/parameters/ReorderOrderId"
        - in: query
          name: addressId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: orderItemId
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Availability preview; no cart or order mutation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReorderPreview"
        "401": { description: Sign-in required }
        "403": { description: Customer role required }
        "404": { description: "Owned order, item or delivery address not found" }
  /customer/orders/{orderId}/repeat:
    post:
      operationId: submitCustomerReorder
      summary: Add eligible exact historical items to cart, never place an order
      security:
        - customerBearer: []
      parameters:
        - $ref: "#/components/parameters/ReorderOrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderSubmission"
      responses:
        "200":
          description: Committed added and unavailable items, with current cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReorderOutcome"
        "400": { description: Invalid request; client price and ownership fields rejected }
        "401": { description: Sign-in required }
        "403": { description: Customer role required }
        "404": { description: "Owned order, item or delivery address not found" }
        "409": { description: Explicit store switch confirmation or a new idempotency intent required }
  /customer/categories:
    get:
      operationId: getCustomerShoppingCategories
      summary: Category filters from stores eligible for a saved delivery pincode
      security:
        - customerBearer: []
      parameters:
        - in: query
          name: pincode
          required: true
          schema:
            type: string
            pattern: '^[1-9]\d{5}$'
      responses:
        "200":
          description: Public category filters; commercial and inventory fields are never included
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerShoppingCategories"
        "400":
          description: Invalid pincode
        "401":
          description: Sign-in required
        "403":
          description: Customer role required
        "404":
          description: No owned saved address for this pincode
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  parameters:
    ReorderOrderId:
      in: path
      name: orderId
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    customerBearer:
      type: http
      scheme: bearer
  schemas:
    CustomerCheckoutSubmission:
      type: object
      additionalProperties: false
      required: [cartId, addressId, paymentMethod, idempotencyKey]
      properties:
        cartId: { type: string, format: uuid }
        addressId: { type: string, format: uuid }
        paymentMethod: { type: string, enum: [COD] }
        idempotencyKey: { type: string, format: uuid }
    CustomerCheckoutOutcome:
      type: object
      required: [order]
      properties:
        order:
          type: object
          description: Existing safe order detail with immutable items and status history
          required: [id, status, totalAmount, items, statusHistory]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [PLACED, ACCEPTED, PREPARING, READY, OUT_FOR_DELIVERY, DELIVERED, REJECTED, CANCELLED] }
            totalAmount: { type: string }
            items: { type: array, items: { type: object } }
            statusHistory: { type: array, items: { type: object } }
    StockFailure:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code:
          type: string
          enum: [OUT_OF_STOCK, INSUFFICIENT_STOCK, VARIANT_UNAVAILABLE, INVALID_QUANTITY, ORDER_ALREADY_PROCESSED, IDEMPOTENCY_CONFLICT]
    ReorderSubmission:
      type: object
      additionalProperties: false
      required: [addressId, idempotencyKey]
      properties:
        addressId: { type: string, format: uuid }
        idempotencyKey: { type: string, format: uuid }
        orderItemId: { type: string, format: uuid }
        confirmStoreSwitch: { type: boolean }
    ReorderItem:
      type: object
      additionalProperties: false
      required: [orderItemId, productName, variantNameSnapshot, quantity, currentUnitPrice, available, reason]
      properties:
        orderItemId: { type: string, format: uuid }
        productName: { type: string }
        variantNameSnapshot: { type: [string, "null"] }
        quantity: { type: integer, minimum: 1 }
        currentUnitPrice: { type: [string, "null"] }
        available: { type: boolean }
        reason: { type: [string, "null"] }
    ReorderPreview:
      type: object
      additionalProperties: false
      required: [storeAvailable, storeSwitchRequired, storeName, existingStoreName, items, canAddCount]
      properties:
        storeAvailable: { type: boolean }
        storeSwitchRequired: { type: boolean }
        storeName: { type: string }
        existingStoreName: { type: [string, "null"] }
        items:
          type: array
          items: { $ref: "#/components/schemas/ReorderItem" }
        canAddCount: { type: integer, minimum: 0 }
    ReorderOutcome:
      type: object
      additionalProperties: false
      required: [cart, added, unavailable, addedCount]
      properties:
        cart:
          description: Existing customer cart response, with server-owned current prices
          type: [object, "null"]
          additionalProperties: true
        added:
          type: array
          items: { $ref: "#/components/schemas/ReorderItem" }
        unavailable:
          type: array
          items: { $ref: "#/components/schemas/ReorderItem" }
        addedCount: { type: integer, minimum: 0 }
    CustomerShoppingCategory:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    CustomerShoppingCategories:
      type: object
      additionalProperties: false
      required: [categories]
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CustomerShoppingCategory"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

