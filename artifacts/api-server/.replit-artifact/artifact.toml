kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "CORS_ALLOWED_ORIGINS=\"${CORS_ALLOWED_ORIGINS:-https://$REPLIT_DEV_DOMAIN}\" pnpm --filter @workspace/api run dev"


[services.production]

[services.production.build]
args = ["sh", "-c", "pnpm install --frozen-lockfile --prod=false && pnpm --filter @workspace/shared-types run build && pnpm --filter @workspace/api run build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["pnpm", "--filter", "@workspace/api", "run", "start"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/health"
